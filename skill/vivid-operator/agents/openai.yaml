display_name: 瞬知 / Vivid Operator
short_description: 通过稳定脚本入口调用瞬知 / Vivid，统一处理 Bilibili、Douyin、本地文件和通用站点。
default_prompt: |
  使用 vivid-operator skill 调用瞬知 / Vivid。

  工作顺序：
  1. 先执行 `paths`
  2. 再执行 `doctor`
  3. 再执行 `quickread`
     - 执行后先看 `ok`
     - 再看 `error_code`、`requires_user_input`、`can_continue_without_sessdata`
     - 成功时优先读取 `result.source`、`result.summary`、`result.artifacts`
     - 失败时优先根据结构化字段决定下一步，不要只看自然语言报错
  4. 最后读取产物目录

  优先使用 skill wrapper：
  - Windows: `skill/vivid-operator/scripts/vivid_operator.ps1`
  - Linux/macOS: `skill/vivid-operator/scripts/vivid_operator.sh`

  不要在 skill 层自己实现下载、字幕、转录或 OCR。
  这些都交给瞬知 / Vivid 主程序处理。

  如果 `paths` 失败：
  - 先检查 `skill/vivid-operator/state/skill_state.json`
  - 再检查 `VIVID_REPO_ROOT`
  - 只有前两者都不能用时，才询问用户 Vivid 仓库路径
  - 用户一旦提供并成功执行过 wrapper，后续应从状态文件恢复，不要反复提同一个问题

  如果 `skill_state.json` 里缺少默认 Whisper 模型或默认输出目录：
  - 先向用户确认一次
  - 之后通过 `-Model` / `-DataDir` 执行一次，让 wrapper 写回状态文件
  - 后续优先从状态文件恢复，不要反复问

  如果 `skill_state.json` 里缺少 `execution_mode` / `artifact_target` / `cloud_profile` / `cloud_base_url`：
  - 先问用户默认走本地还是云端
  - 如果选云端，再问产物存本地、云端还是两边
  - 如果用户已经配置了命名 profile，再确认 profile 名
  - 否则直接确认远端 Vivid Web API 地址
  - 成功执行一次后写回状态文件

  如果 source 是 Bilibili：
  - 有 `SESSDATA` 时，先尝试官方字幕
  - 如果返回 `error_code = "bili_sessdata_expired"`，必须先问用户
  - 用户提供新值：用 `-Sessdata/--sessdata` 重试
  - 用户不提供：用 `-NoSessdata/--no-sessdata` 重试，显式忽略环境里的 `BILI_SESSDATA`

  如果 `quickread` 失败但返回了结构化诊断：
  - 优先读取 `error_summary`
  - 再读取 `failure_chain`
  - 如果 `requires_user_input = true`，先完成交互，再决定是否重试

  默认输出目录通常在：
  - `./data/项目名/artifacts/`

  如果 `skill_state.json` 里已经有 `default_data_dir`：
  - 优先使用那个默认输出目录
  - 不要在上下文丢失后临时猜一个新目录

  如果 `execution_mode = cloud`：
  - 当前 skill 会调用远端 Vivid Web API
  - `local_only` / `both` 时会把核心产物同步回本地默认输出目录
  - `cloud_only` 时只返回云端产物引用
  - `cloud_profile` 只是可选命名配置；没有 profile 映射时，优先直接用 `cloud_base_url`
  - 如果宿主环境本身通过 MCP 调用，这个 MCP 也应作为仓库外桥接层转发到远端 Vivid Web API；不要假设当前仓库内置了 MCP server

  重点产物通常包括：
  - `quickread.md`
  - `transcript.txt`
  - `summary.md`
  - `summary.json`
  - `metadata.json`
  - `vector_source/document.json`
  - `vector_source/chunks.jsonl`
  - `vector_source/manifest.json`

  如果任务和向量化 / embedding / RAG / 知识库入库有关：
  - 优先读取 `vector_source/`
  - 不要优先从 `quickread.md` 或 `summary.md` 反解析

  成功读取到摘要后，必须完整返回这 6 段：
  - 标题
  - 内容概览
  - 核心观点
  - 争议点
  - 行动建议
  - 俏皮点评

  不要只摘标题、只摘核心观点，或者只给一段简短总结。
  `行动建议` 必须保留推荐阅读、继续学习方向、以及证真/交叉验证建议。
